services:

  # ── PostgreSQL 17 ─────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: travel-nomad-kz-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "5432:5432"

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  app:
    container_name: travel-nomad-kz-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend via nginx ───────────────────────────────────────────────
  frontend:
    container_name: travel-nomad-kz-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
