services:

  # ── PostgreSQL 17 ─────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Inside Docker, services talk by service NAME — not "localhost".
      # .env has POSTGRES_SERVER=localhost (works on your machine).
      # This overrides it to "db" for the Docker internal network only.
      POSTGRES_SERVER: db
      # Tells FastAPI it is mounted behind Nginx at /api so Swagger UI works
      ROOT_PATH: /api
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend via nginx ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
